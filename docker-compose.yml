services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rpm_v1_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5534}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rpm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rpm_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-rpm_v1}
    volumes:
      - rpm_v1_pgdata:/var/lib/postgresql/data
      - ./scripts/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rpm_user} -d ${POSTGRES_DB:-rpm_v1}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rpm_v1_pgdata:
    name: rpm_v1_pgdata
